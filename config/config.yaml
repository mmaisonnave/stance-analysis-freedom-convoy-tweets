  url-database-folder: 'data/generated/url_database/'

variables:
  vocab-threshold: 50

  openai-tweet-stance-detector-configuration:
    model-name: 'gpt-4.1-nano-2025-04-14'
    openai-key: 'project_key_2'
    user-eval-developer-prompt-name: 'openai-evaluate-user-developer-prompt'
    tweet-eval-developer-prompt-name: 'openai-evaluate-tweet-developer-prompt'
    user-timeline-max-tweet-count: 50
    seed: 4056901968

  create-random-sample-tweets-configuration:
    target-sizes: [35, 30, 35]  # 40% left, 20% neutral, 40% right
    seed: 3800771516
    output-filename: 'random_sample_tweets.csv'

  URL-summarizer-configuration:
    model-name: 'gpt-4.1-nano-2025-04-14'
    openai-key: 'project_key_2'
    prompt: >
      You are a useful assistant that recieves the html of a webpage and summarizes it in a concise way.
      The summary should one paragraph long. It should start stating what kind of 
      webpage it is (e.g., news article, blog post, etc.).
      The summary should be written in a neutral tone, without any personal opinions or biases.
      The summary should include the main points of the webpage, but not every detail.
      The summary should be easy to read and understand, even for someone who is not familiar with the topic.
      DO NOT make any assumptions about the content of the webpage and do not make up any information.
    temperature: 0.0
